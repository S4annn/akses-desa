    <style>
      *,*::before,*::after { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; background: #fafafa; color: #0F172A; }

      #app-boot {
        position: fixed; inset: 0; z-index: 9999;
        display: grid; place-items: center;
        background: linear-gradient(135deg, rgba(15, 118, 110, 0.92), rgba(6, 95, 70, 0.92)), url('/desa.jpg') center/cover;
        color: #fff;
        transition: opacity 0.4s ease;
      }
      #app-boot.fade-out { opacity: 0; pointer-events: none; }
      .boot-content { text-align: center; animation: boot-in 0.5s ease-out; }
      @keyframes boot-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      .boot-logo {
        position: relative; width: 88px; height: 88px; margin: 0 auto;
        border-radius: 22px;
        background: #fff;
        display: grid; place-items: center;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        animation: boot-float 2.4s ease-in-out infinite;
        overflow: hidden;
      }
      @keyframes boot-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      .boot-logo::before, .boot-logo::after {
        content: ''; position: absolute; inset: -3px; border-radius: 25px;
        background: rgba(94, 234, 212, .25);
        animation: boot-pulse 2s ease-in-out infinite;
        z-index: 0;
      }
      .boot-logo::after { animation-delay: .4s; }
      @keyframes boot-pulse { 0%,100% { transform: scale(1); opacity: .5; } 50% { transform: scale(1.5); opacity: 0; } }
      .boot-logo img { position: relative; z-index: 1; width: 70%; height: 70%; object-fit: contain; }
      .boot-title { margin-top: 22px; font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
      .boot-title span { color: #5eead4; }
      .boot-sub { margin-top: 4px; font-size: 13px; opacity: .75; }
      .boot-dots { margin-top: 28px; display: flex; gap: 6px; justify-content: center; }
      .boot-dots span {
        width: 8px; height: 8px; border-radius: 50%; background: #5eead4;
        animation: boot-dot 1.2s ease-in-out infinite;
      }
      .boot-dots span:nth-child(2) { animation-delay: .2s; }
      .boot-dots span:nth-child(3) { animation-delay: .4s; }
      @keyframes boot-dot { 0%,100% { transform: scale(1); opacity: .4; } 50% { transform: scale(1.4); opacity: 1; } }
      .boot-message { margin-top: 16px; font-size: 13px; font-weight: 500; opacity: .85; }
      @media (prefers-reduced-motion: reduce) {
        .boot-logo, .boot-logo::before, .boot-logo::after, .boot-dots span { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="app-boot" role="status" aria-label="Memuat aplikasi">
      <div class="boot-content">
        <div class="boot-logo" aria-hidden="true">
          <img src="/logo.png" alt="Logo Desa" />
        </div>
        <h1 class="boot-title">Desa<span> Condongcatur</span></h1>
        <p class="boot-sub">Portal Digital Desa</p>
        <div class="boot-dots" aria-hidden="true"><span></span><span></span><span></span></div>
        <p class="boot-message">Memuat...</p>
      </div>
    </div>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; text-align: center; font-family: system-ui;">
        AksesDesa membutuhkan JavaScript untuk berjalan.
      </div>
    </noscript>
    <script>
      window.addEventListener('load', function () {
        setTimeout(function () {
          var boot = document.getElementById('app-boot');
          if (boot) {
            boot.classList.add('fade-out');
            setTimeout(function () { boot.remove(); }, 400);
          }
        }, 300);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
