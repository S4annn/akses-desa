<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AksesDesa — Portal digital desa yang lebih mudah, transparan, dan responsif." />
    <meta name="theme-color" content="#0F766E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <title>AksesDesa — Portal Digital Desa</title>
    <style>
      /* Initial boot splash — terlihat instant sebelum React load */
      #app-boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background:
          linear-gradient(135deg, rgba(15, 118, 110, 0.92), rgba(6, 95, 70, 0.92)),
          url('/desa.jpg') center/cover;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        color: #fff;
        transition: opacity 0.4s ease;
      }
      #app-boot.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      .boot-content {
        text-align: center;
        animation: boot-in 0.5s ease-out;
      }
      @keyframes boot-in {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .boot-logo {
        position: relative;
        width: 76px;
        height: 76px;
        margin: 0 auto;
        border-radius: 22px;
        background: linear-gradient(135deg, #5eead4, #14b8a6);
        display: grid;
        place-items: center;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        animation: boot-float 2.4s ease-in-out infinite;
      }
      @keyframes boot-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }
      .boot-logo::before,
      .boot-logo::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.18);
        animation: boot-pulse 2s ease-in-out infinite;
      }
      .boot-logo::after { animation-delay: 0.4s; }
      @keyframes boot-pulse {
        0%, 100% { transform: scale(1); opacity: 0.5; }
        50% { transform: scale(1.5); opacity: 0; }
      }
      .boot-logo svg {
        position: relative;
        z-index: 1;
        width: 38px;
        height: 38px;
        fill: #fff;
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
      }
      .boot-title {
        margin-top: 22px;
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .boot-title span { color: #5eead4; }
      .boot-sub {
        margin-top: 4px;
        font-size: 13px;
        opacity: 0.75;
      }
      .boot-dots {
        margin-top: 28px;
        display: flex;
        gap: 6px;
        justify-content: center;
      }
      .boot-dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #5eead4;
        animation: boot-dot 1.2s ease-in-out infinite;
      }
      .boot-dots span:nth-child(2) { animation-delay: 0.2s; }
      .boot-dots span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes boot-dot {
        0%, 100% { transform: scale(1); opacity: 0.4; }
        50% { transform: scale(1.4); opacity: 1; }
      }
      .boot-message {
        margin-top: 16px;
        font-size: 13px;
        font-weight: 500;
        opacity: 0.85;
      }
      .boot-tagline {
        position: absolute;
        bottom: 32px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 11px;
        font-style: italic;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <div id="app-boot">
      <div class="boot-content">
        <div class="boot-logo">
          <svg viewBox="0 0 24 24"><path d="M12 3 L21 12 L18.5 12 L18.5 21 L14 21 L14 15 L10 15 L10 21 L5.5 21 L5.5 12 L3 12 Z" /></svg>
        </div>
        <h1 class="boot-title">Akses<span>Desa</span></h1>
        <p class="boot-sub">Portal Digital Desa Modern</p>
        <div class="boot-dots"><span></span><span></span><span></span></div>
        <p class="boot-message">Mempersiapkan layanan desa...</p>
      </div>
      <p class="boot-tagline">"Semua layanan desa, kini dalam satu akses."</p>
    </div>
    <div id="root"></div>
    <script>
      // Hide boot splash setelah React mount
      window.addEventListener('load', function () {
        setTimeout(function () {
          var boot = document.getElementById('app-boot');
          if (boot) {
            boot.classList.add('fade-out');
            setTimeout(function () { boot.remove(); }, 400);
          }
        }, 300);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
